outcomes:
- Describe RAG as retrieve-then-generate, and say what it offers that the model's own weights cannot.
- Implement BM25 keyword scoring, reciprocal rank fusion and chunking, and explain what each corrects.
- Adopt a vector database and say what it adds to a hand-written search, and at what size it starts to matter.
- Measure every retrieval change, and report honestly when a fashionable technique makes no difference.
