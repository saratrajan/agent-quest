  note: 'Read the abstract and the introduction, and study figure 1. The paper''s framing is worth keeping: a model has "parametric" memory in its weights and can be given "non-parametric" memory in a searchable store. Notice the two benefits claimed in the introduction, that the store can be updated without retraining and that the sources of an answer can be inspected.'
