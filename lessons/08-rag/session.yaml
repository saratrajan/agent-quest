  title: Hallucinations, tool use, and knowledge against working memory
  channel: Andrej Karpathy
  youtube_id: 7xTGNNLPyMI
  start: 4832
  end: 6106
  watch_for:
  - 'The distinction between what is in the parameters (a vague recollection) and what is in the context window (working memory). RAG moves knowledge from the first to the second.'
  - How a model can be given the means to look something up instead of guessing.
  - Tool use, which is the next session. Retrieval today was a lookup you chose; next the model chooses.
- id: p1
  kind: problem
  section: Homework
  points: 3
  title: BM25 by hand
  prompt: 'Three documents: d0 = "refund late", d1 = "refund refund queue slow", d2 = "login error page down". Score the query "refund" against each with k₁ = 1.5 and b = 0.75. Which wins, and what does that show about repetition and length?'
  answer: 'N = 3 and "refund" is in 2 documents, so idf = ln(1.5 ÷ 2.5 + 1) = ln 1.6 = 0.470. The average length is (2 + 4 + 4) ÷ 3 = 3.33. For d0, f = 1 and L = 2: the bottom is 1 + 1.5 × (0.25 + 0.75 × 2 ÷ 3.33) = 2.05, so the score is 0.470 × 2.5 ÷ 2.05 = 0.573. For d1, f = 2 and L = 4: the bottom is 2 + 1.5 × (0.25 + 0.75 × 4 ÷ 3.33) = 3.725, so the score is 0.470 × 5 ÷ 3.725 = 0.631. d2 scores 0. d1 wins, but only just: twice the mentions earned about 10% more, because repetition is damped and the document is longer than average. Plain word counting would have scored d1 twice as high as d0.'
- id: p2
  kind: problem
  section: Homework
  points: 2
  title: Fuse two rankings
  prompt: 'Keyword search returns [x, y, z] and vector search returns [z, x, w]. Merge them with reciprocal rank fusion at k = 60, showing each total. Why can the BM25 scores and cosine scores not simply be added instead?'
  answer: 'x earns 1/61 + 1/62 = 0.0325; z earns 1/63 + 1/61 = 0.0323; y earns 1/62 = 0.0161; w earns 1/63 = 0.0159. Merged: x, z, y, w. The two items found by both searches lead, and x edges z because its two positions (first and second) are slightly better than z''s (third and first). The raw scores cannot be added because they are on unrelated scales: BM25 is unbounded and depends on the collection, cosine lies between −1 and 1 and in practice in a narrow band near the top. Adding them would let whichever has the larger numbers decide. Ranks are comparable; scores are not.'
- id: p3
  kind: problem
  section: Homework
  points: 3
  title: How many neighbours?
  prompt: 'With 1 retrieved incident the model scored 20% on priority and 91% on service, using 254 prompt tokens. With 5: 54% and 88%, 559 tokens. With 10: 54% and 90%, 941 tokens. Why is one neighbour enough for service and not for priority? Which k would you run in production, and what is your argument?'
  answer: 'Service is nearly a property of the problem: every past incident with this cause was on the same service, so a single good neighbour settles it. Priority varies between incidents with the same cause, typically across two adjacent levels, so one example is one draw from a distribution, and the model, which leans towards severe, is not pulled back by it. Several neighbours show where the weight lies. I would run k = 5. Ten costs 68% more tokens on every request for no measurable gain on priority and two points on service, which is inside the noise for 100 incidents. I would revisit it if the incident history became more varied.'
- id: p4
  kind: problem
  section: Homework
  points: 2
  title: One sentence
  prompt: 'Adding one sentence to the prompt ("start from the priority most of the similar incidents ended at...") raised priority exact from 54% to 66% and within-one from 75% to 91%. In the confusion table, real P1s called P1 went from 2 of 2 to 1 of 2; the other was called P3. Would you ship the sentence? What else would you want to know?'
  answer: 'Not on these numbers alone. The average improved a great deal, mostly by stopping P3 and P4 incidents being called P1, which is real value: far fewer false alarms. But the cost landed on the rarest and most expensive class. The anchoring sentence pulls every answer towards the neighbours'' usual priority, and a true P1 whose neighbours were mostly P3 gets pulled down with the rest. With two P1s in the test set nothing can be concluded statistically, so I would read that incident and its retrieved neighbours, gather more P1 and P2 examples for the evaluation, and look for a rule that keeps the gain without the miss, such as never lowering a priority below what the reporter chose without flagging it for a person. An improvement in the average that makes the worst case worse is a trade, and it has to be made deliberately.'
- id: q1
  kind: review
  section: Homework
  title: Explain RAG, and when to use it
  question: Explain retrieval-augmented generation, and say when you would choose it over fine-tuning the model on your data.
  model_answer: 'RAG is two steps: search your own documents for the passages relevant to a request, then put them in the prompt so the model answers from them. The model is unchanged; the knowledge lives in a store you control. I choose it when the knowledge changes often, when answers must be traceable to a source, when access to information must be controlled per user, or when the volume of facts is large. All of those hold for incident history. Fine-tuning changes the model''s weights and suits a different need: teaching a behaviour, a format or a domain''s vocabulary that is stable and that examples in the prompt cannot convey compactly. They are not rivals; a fine-tuned model can still be given retrieved evidence. I would start with RAG because it is cheaper to build, immediate to update and easy to inspect, and fine-tune only when measurement shows a gap that retrieval cannot close.'
- id: q2
  kind: review
  section: Homework
  title: Choosing a chunk size
  question: How do you decide how to chunk documents for retrieval?
  model_answer: By the shape of the documents and the questions, then by measurement. A chunk should hold one answerable unit of meaning, so I start from natural boundaries such as sections, paragraphs, or one work note, before falling back to fixed windows with some overlap. Small chunks match a specific question sharply and may lack the context to be useful once retrieved; large ones carry context and match vaguely. I pick two or three candidate sizes and measure retrieval quality on real queries. On our incident threads chunking made no measurable difference, because the identifying information is in the first two lines, so the simplest scheme, one vector per incident, was the right one. I would expect a different answer for long runbooks or design documents.
- id: q3
  kind: review
  section: Homework
  title: Re-ranking made it worse
  question: You added a re-ranking step and retrieval quality went down slightly. How do you explain that, and would you ever use re-ranking?
  model_answer: 'First, a three-point drop on a hundred queries is within noise, so the accurate statement is that it did not help. It did not help for two reasons. The first-stage ranking was already near the ceiling the data allows, so there was almost nothing to gain. And the re-ranker was a small general-purpose model asked to order ten similar-looking tickets, a task it was never trained for, at the cost of an extra model call per query. Re-ranking earns its place when the first stage has good recall but poor ordering, for example a relevant document reliably in the top fifty but rarely in the top five, and when the re-ranker is a model trained for relevance. I would measure recall at 50 against recall at 5 first; if they are close, there is nothing for a re-ranker to do.'
- id: q4
  kind: review
  section: Homework
  title: Beaten by a vote
  question: With retrieved evidence in the prompt, the language model scored 54% on priority; a majority vote over the same evidence scored 67%. What do you conclude?
  model_answer: 'That giving a model the evidence is not the same as the model using it well. The retrieval was identical, so the gap is in how the evidence was read: the model still leaned towards severe, calling twenty P3 incidents P1 that their neighbours would have settled. One sentence telling it to start from the neighbours'' usual priority closed the gap, which shows it was an instruction problem and not a capability problem. More broadly, a simple method is the benchmark any model-based step has to beat, and where it does not, the options are to fix the prompt, to use the simple method for that decision, or to use it as a cross-check. I would keep the vote in the system either way, as a baseline in every evaluation and as a signal when the model disagrees with it.'
- id: q5
  kind: review
  section: Homework
  title: Why a database at all?
  question: Your hand-written search was faster than the vector database on this data. Why adopt the database?
  model_answer: 'For 400 vectors I would not need it, and I would say so plainly. A matrix product in memory took a third of a millisecond. What the database provides is everything around the search: storage that survives a restart, text and metadata kept with each vector, filtering by metadata during the search, incremental adds and deletes, and an approximate index that keeps query time low as the collection grows into the millions. Those matter as soon as the system is real, with data arriving continuously and more than one process using it. So the decision is about operations and growth, not about speed today. Having written the exact version, I also know what the approximation costs: on our data the two agreed on 489 results of 500.'
