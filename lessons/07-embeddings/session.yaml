- id: p1
  kind: problem
  section: Homework
  points: 3
  title: Cosine by hand
  prompt: 'Let a = [2, 1, 0], b = [1, 2, 2] and c = [4, 2, 0]. Compute cos(a, b), cos(a, c) and cos(c, b). Then compute the straight-line distance from a to b and from c to b. What do the two sets of numbers tell you about why search uses cosine?'
  answer: 'a · b = 2 + 2 + 0 = 4; the lengths are √5 = 2.236 and √9 = 3, so cos(a, b) = 4 ÷ 6.708 = 0.596. c is a doubled, so cos(a, c) = 1 and cos(c, b) = 8 ÷ (4.472 × 3) = 0.596, unchanged. Distances: a to b is √(1 + 1 + 4) = 2.449; c to b is √(9 + 0 + 4) = 3.606. The distance changed although c says exactly what a says, only "louder". A longer text or a repeated phrase can lengthen a vector without changing its meaning, so search compares direction. Once every vector is normalised to length 1 the two measures rank results identically.'
- id: p2
  kind: problem
  section: Homework
  points: 2
  title: Hit rate from a table
  prompt: 'Five queries. The rank of the first truly related result for each is: 1, 3, none in the top ten, 2, 6. Compute the hit rate at 1, at 3 and at 5. If each retrieved incident costs about 120 tokens in the prompt, what does going from k = 3 to k = 5 buy, and what does it cost?'
  answer: 'At 1: only the first query, 1 ÷ 5 = 0.2. At 3: queries one, two and four, 0.6. At 5: still 0.6, because the fifth query''s hit is at rank 6. So moving from 3 to 5 results buys nothing on this set and costs 240 more tokens per request, read on every call. It would take k = 6 to reach 0.8. This is why k is chosen by measurement, not by instinct.'
- id: p3
  kind: problem
  section: Homework
  points: 3
  title: A floor that will not move
  prompt: 'Shared words found a related incident at rank 1 for 89% of the held-back incidents and in the top five for 92%. Embeddings scored 87% and 92%. (a) Why is the floor so strong on this data? (b) Give one kind of query where you would expect embeddings to win clearly. (c) Both stop at 92%. What are the other 8%, and what follows for how you spend your time?'
  answer: '(a) Recurring problems are reported in recurring words here: the same alert text, the same phrases from support. When a query shares its wording with the thing sought, counting words is nearly perfect. (b) A report in different words from the history, such as a customer''s paraphrase, a different language, or a symptom described where the history describes a cause: "we cannot log in on the phone" matched nothing useful by words and found sign-in incidents by embedding. (c) They are mostly the vague reports, whose text carries no information about the cause. No retrieval method can fix that. The time is better spent on a different signal, for example what else was opened in the same few minutes, or on having the agent say that it does not have enough to go on.'
- id: p4
  kind: problem
  section: Homework
  points: 2
  title: What the vote is telling you
  prompt: A vote among the five nearest incidents scores 67% on priority and 86% on service with no language model, against 3% and 66% for the model alone. What does that imply about what the model was missing? And why might the vote still get priority wrong when all five neighbours are about the right problem?
  answer: 'The model was missing evidence, not ability. The same incidents it mis-triaged become easy once their nearest relatives are in view, so the first thing to give the model is exactly those relatives with their outcomes. The vote goes wrong on priority because incidents with the same cause did not all end at the same priority: one outage was a P2 and its recurrence a P3, depending on how many customers it reached. Five neighbours split three to two, and the majority is sometimes the wrong side. Deciding between them needs the details of this particular ticket, the scale mentioned and the time of day, which is reading, and reading is what a language model is for.'
- id: q1
  kind: review
  section: Homework
  title: Explain an embedding
  question: Explain what an embedding is to an engineer who knows databases but not machine learning.
  model_answer: 'It is a fixed-length array of numbers computed from a piece of text by a model, with the property that texts which mean similar things get arrays that point in similar directions. Think of it as a learned index key for meaning. You compute it once per document and store it beside the row. At query time you compute it for the question and look for the stored keys closest in angle. The model that computes it was trained on a very large number of text pairs to produce that property, and you treat it as a fixed function: same model, same text, same vector. Two consequences for a database person: vectors from different models are incomparable, so changing the model means recomputing the column, and the comparison is a similarity ranking, not an equality match, so results are approximate by nature.'
- id: q2
  kind: review
  section: Homework
  title: Why cosine?
  question: Why is cosine similarity the usual measure for text embeddings, and does the choice matter?
  model_answer: Cosine measures the angle between two vectors and ignores their lengths. For text that is the right invariance, because length tends to reflect things like how long the text is, while direction reflects what it is about. It matters when vectors are not normalised, where a straight-line distance would rank a long relevant document below a short irrelevant one. Once vectors are scaled to unit length, cosine, dot product and straight-line distance all produce the same ranking, so most systems normalise once at write time and use the dot product, which is the cheapest. The practical rule is to use the measure the embedding model was trained with, which its documentation states.
- id: q3
  kind: review
  section: Homework
  title: Keywords did as well
  question: Your own measurement shows keyword overlap matching embeddings on this data. Would you still build vector search?
  model_answer: 'I would keep both, and the measurement tells me how to weight the effort. Keywords are strong here because recurring incidents arrive in recurring words; they are also cheap, exact on identifiers such as error codes and incident numbers, and easy to explain. Embeddings cover the queries keywords cannot: paraphrases, a customer''s description of a problem engineers describe differently, other languages. The held-back set under-represents those because most of it comes from the same reporting channels as the history. So I would combine the two rankings, which costs little, and add paraphrased queries to the evaluation set so the benefit of embeddings is measured and not assumed. I would not present vector search as the reason the system works when the data says otherwise.'
- id: q4
  kind: review
  section: Homework
  title: Why measure retrieval separately?
  question: You already have an end-to-end triage score. Why measure retrieval by itself as well?
  model_answer: Because the end-to-end score cannot tell me where a failure happened. A wrong triage could mean the right incident was never retrieved, or it was retrieved and the model ignored it, or it was retrieved and was misleading. Each has a different fix. Measuring retrieval separately gives an upper bound on what the later stages can achieve, lets me tune retrieval in milliseconds without calling a language model, and shows the ceiling set by the data, which here is 92% because some reports contain no usable information. I would always keep at least two numbers, one for retrieval and one for the final answer, and look at the cases where they disagree.
- id: q5
  kind: review
  section: Homework
  title: Why use a language model at all?
  question: A nearest-neighbour vote with no language model gets 86% of services right. Why add a language model on top?
  model_answer: 'First I would take the result seriously: for the classification part of triage, retrieval plus a vote may be all that is needed, and it is faster, cheaper and easier to audit. A language model earns its place where the vote cannot go. It can weigh the details of this ticket against neighbours that disagree, which is where the vote loses priority accuracy. It can decide that different lookups are needed, such as a recent deploy. It can produce the parts of triage that are not a label: the probable cause, the first steps, the reason. And it can say that the evidence is too thin. So the design question is which decisions go to which component, and the vote becomes both a baseline the model must beat and a cross-check on its answers.'
