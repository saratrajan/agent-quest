outcomes:
- Explain what an embedding model produces and why direction, not length, carries the meaning.
- Write cosine similarity and exact nearest-neighbour search, first by hand and then as one matrix product.
- Measure retrieval by itself with a hit rate at k, against a floor that uses no model.
- Triage by a vote among the nearest past incidents, and explain why it beats an unaided language model.
