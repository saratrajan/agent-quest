  url: https://arxiv.org/abs/1908.10084
  note: 'Read the abstract and the introduction. The motivating number is in the abstract: finding the most similar pair among 10,000 sentences took about 65 hours by comparing every pair inside the model, and about 5 seconds once each sentence had its own vector. That is the reason search works on stored vectors. Look at figure 2 for how two texts are compared at search time.'
