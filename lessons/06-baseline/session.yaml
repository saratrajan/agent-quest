outcomes:
- Explain why the newest 100 incidents are held back, and name two ways answers can leak into a result.
- Write the scoring for triage (exact, within one level, service) and read a confusion table for the direction of the errors.
- Compute the floors a model must beat, including the process that already exists, before quoting any score.
- Judge whether a difference between two scores on 100 incidents is real or noise.
steps:
- id: eval-concepts
  kind: video
  section: Pre-work
  title: Evaluation concepts in fifteen minutes
  channel: Hamel Husain
  youtube_id: 3rlYBCDK0K4
  start: 0
  end: 863
  watch_for:
  - The difference between a public model benchmark and an evaluation of your own product on your own data.
  - Error analysis, reading real outputs one by one, as the step that tells you what to measure.
  - 'The traps listed near the end. Note which ones a score on 100 incidents could fall into.'
- id: confusion-matrix
  kind: video
  section: Pre-work
  title: The confusion matrix
  channel: StatQuest with Josh Starmer
  youtube_id: Kdsp6soqA7o
  start: 0
  end: 432
  watch_for:
  - 'How to read the table: rows and columns, and what the diagonal means.'
  - The 3 × 3 example from 4:47. Triage has four priorities, so yours will be 4 × 4.
  - Why two methods with similar accuracy can make very different kinds of mistake.
- id: evals-essay
  kind: reading
  section: Pre-work
  title: Your AI product needs evals
  source: Hamel Husain, 2024 · hamel.dev
  url: https://hamel.dev/blog/posts/evals/
  note: 'Read the opening and the section on the first level of evaluation (unit tests: cheap checks with exact answers, run on every change). That level is what you build today. Skim the later levels (human review, online tests) to see where this leads; session 14 returns to them.'
