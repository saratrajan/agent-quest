  kind: exercise
  section: Session
  title: The confusion table
  file: scoring.py
  test: lessons/06-baseline/test_scoring.py::test_confusion_on_the_lesson_example lessons/06-baseline/test_scoring.py::test_confusion_diagonal_adds_up_to_the_exact_matches
