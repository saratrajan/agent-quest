  file: scoring.py
  test: lessons/06-baseline/test_scoring.py::test_prompt_carries_the_incident_the_choices_and_the_format lessons/06-baseline/test_scoring.py::test_prompt_changes_with_the_incident_and_the_service_list
  brief: 'Write build_prompt: the whole request for one incident, with its summary and description, the service ids to choose from, and a request for JSON with the keys "priority" and "service". The wording is yours; the tests only check that the ingredients are there.'
- id: ex-parse
  kind: exercise
  section: Session
  title: Read the reply safely
  file: scoring.py
  test: lessons/06-baseline/test_scoring.py::test_parse_accepts_the_shapes_a_model_really_returns lessons/06-baseline/test_scoring.py::test_parse_returns_none_instead_of_raising
  brief: 'Write parse_triage: turn the reply into a priority from 1 to 4 and a service name, or return None. It must never raise, whatever the model sends back.'
- id: exp-baseline
  kind: experiment
  section: Session
  title: The model alone, on all 100
  prompt: 'Your prompt, your parser and your scoring, run over the 100 held-back incidents with qwen3:4b at temperature 0 (about a minute). In session 5 it got one priority in five right on a handful. Predict the three scores, and predict the shape of the confusion table: which side of the diagonal will the mistakes fall on? Then run it a second time and compare the two results.'
  command: python lessons/06-baseline/baseline.py --run
- id: exp-rubric
  kind: experiment
  section: Session
  title: Tell it the rules, then tell it the reporter's answer
  prompt: 'Two more runs. The first puts the company''s definition of P1 to P4 in front of your prompt. The second also tells the model which priority the reporter chose. Predict the priority score of each. For the second, also predict two counts the script prints: of the incidents where the reporter was wrong, how many does the model correct, and of those where the reporter was right, how many does it break?'
  command: python lessons/06-baseline/baseline.py --run --rubric && python lessons/06-baseline/baseline.py --run --rubric --reported
