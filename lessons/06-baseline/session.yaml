- id: ex-majority
  kind: exercise
  section: Session
  title: The lazy triager
  file: scoring.py
  test: lessons/06-baseline/test_scoring.py::test_majority_baseline_on_the_lesson_example
  brief: 'Write majority_baseline: the most common priority and the most common service in a set of labels.'
- id: exp-floor
  kind: experiment
  section: Session
  title: Look around, then find the floor
  prompt: 'With the service desk running (make desk), the script first shows what a resolved incident carries and what a held-back one does not, then scores two triagers that use no intelligence: one that always gives the most common priority and service from history, and one that keeps whatever priority the reporter chose. Predict both priority scores (exact and within one level) before you run it. Which of the two is the bar your agent has to clear?'
  command: python lessons/06-baseline/baseline.py --tour --floor
- id: ex-prompt
  kind: exercise
  section: Session
