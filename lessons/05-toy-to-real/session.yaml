outcomes:
- Implement temperature, top-k and top-p sampling, and say what each is for.
- Explain the context window as a token budget, and what happens when a prompt exceeds it.
- Describe what is the same and what differs between the GPT you trained and a 4-billion-parameter model.
- 'Measure a real model''s speed, and see how it triages incidents with no help: the baseline the agent must beat.'
steps:
- id: intro-to-llms
  kind: video
  section: Pre-work
  title: 'Intro to large language models: inference, training and fine-tuning'
  channel: Andrej Karpathy
  youtube_id: zjkBMFhNj_g
  start: 0
  end: 1265
  watch_for:
  - 'A model as two files: the parameters, and a few hundred lines of code that run them.'
  - Training as compressing a large amount of text, and why the result can produce plausible but false text.
  - The second stage, fine-tuning into an assistant, which your GPT from session 4 never had.
- id: softmax-temperature
  kind: video
  section: Pre-work
  title: Softmax with temperature
  channel: 3Blue1Brown
  youtube_id: wjZofJX0v4M
  start: 1342
  end: 1563
  watch_for:
  - Temperature as a divisor applied to the scores before the softmax.
  - What a temperature of zero and a high temperature each do to the output.
  - Why a little randomness tends to read better than always taking the top choice.
- id: nucleus-paper
  kind: reading
  section: Pre-work
  title: The curious case of neural text degeneration
  source: Holtzman, Buys, Du, Forbes and Choi, 2020 · arXiv:1904.09751
  url: https://arxiv.org/abs/1904.09751
  note: 'The paper that introduced top-p sampling. Read the introduction and look at figure 1, which shows text going wrong in two opposite ways: repetitive when always taking the likeliest token, incoherent when sampling the whole distribution. Then read section 3.1 for the method.'
