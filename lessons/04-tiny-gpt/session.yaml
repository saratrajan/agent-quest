  prompt: 'You will train 4 blocks of width 128 on the incident threads for 2,000 steps; it takes about a minute. One attention head reached a loss of 2.2. Predict the final validation loss, the gap between training and validation loss, and what the 400 generated characters will get right: words? timestamps? a whole work note?'
  command: python lessons/04-tiny-gpt/train.py
