outcomes:
- 'Assemble a GPT from parts you understand: embeddings, multi-head attention, feed-forward layers, residual connections and normalisation.'
- Count a transformer's parameters by hand and say where most of them are.
- Train a model on the incident threads and read its training and validation loss.
- Explain why a loss only means something next to a baseline and a description of the data.
steps:
- id: transformers-visual
  kind: video
  section: Pre-work
  title: Transformers, the tech behind LLMs
  channel: 3Blue1Brown
  youtube_id: wjZofJX0v4M
  start: 0
  end: 1342
  watch_for:
  - 'The overall flow: embed, alternate attention and feed-forward layers many times, then turn the last vector into scores.'
  - How much of the model is just large matrices of learned numbers, and how they are counted.
  - Embedding and unembedding as the two ends of the model. You wire both up today.
- id: gpt-big-picture
  kind: video
  section: Pre-work
  title: 'Let''s build GPT: decoder-only models and where ChatGPT fits'
  channel: Andrej Karpathy
  youtube_id: kCc8FmEb1nY
  start: 6159
  end: 6872
  watch_for:
  - Why a GPT is a decoder-only transformer, and what the encoder was for.
  - The difference between pre-training on raw text, which you do today, and fine-tuning into an assistant.
  - How small today's model is next to the ones in everyday use.
- id: resnet-paper
  kind: reading
  section: Pre-work
  title: Deep residual learning for image recognition
  source: He, Zhang, Ren and Sun, 2015 · arXiv:1512.03385
  url: https://arxiv.org/abs/1512.03385
  note: 'An image paper, read here for one idea that every transformer uses. Read the introduction and section 3.1, and study figure 2: a layer that learns a correction to its input instead of a replacement. That is the x + f(x) you write in Block.forward.'
