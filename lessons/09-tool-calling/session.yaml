outcomes:
- Explain tool calling as text in and text out, and say exactly which code runs the tool.
- Write the tool loop by hand, including clipped results, errors returned to the model and a step limit.
- Describe a tool to a model with a schema, and say why the description decides whether the tool is used well.
- Compare native tool calling with constrained output on tokens and time, from your own measurements.
steps:
- id: how-tool-calling-works
  kind: video
  section: Pre-work
  title: How tool calling works
  channel: Tommy Eberle
  youtube_id: QiRdYCNXAxk
  start: 0
  end: 960
  watch_for:
  - 'The first three minutes: the model does not run anything; it writes a request that other code carries out.'
  - How the tool descriptions reach the model. They are part of the prompt.
  - 'The limitations near the end. Note two that would matter for a triage agent.'
- id: what-is-tool-calling
  kind: video
  section: Pre-work
  title: What is tool calling?
  channel: IBM Technology
  youtube_id: h8gMhXYAv1k
  start: 0
  end: 296
  watch_for:
  - The round trip drawn on the board. Count how many times the model is called for one tool use.
  - What is sent along with the user's message on the first call.
  - 'The two styles described: the application runs the tool, or a library does. Today you write the first.'
- id: react-paper
  kind: reading
  section: Pre-work
  title: 'ReAct: synergizing reasoning and acting in language models'
  source: Yao, Zhao, Yu, Du, Shafran, Narasimhan and Cao, 2022 · arXiv:2210.03629
  url: https://arxiv.org/abs/2210.03629
  note: 'Read the introduction and study figure 1, which shows the same question attempted four ways: acting only, reasoning only, and the two interleaved. The interleaved pattern, a short thought and then one action, is the one the experiments use. Skim section 2 for how a thought differs from an action: a thought changes nothing in the world.'
- id: a-model-that-asks
  kind: concept
  section: Session
  title: A model that asks for things
  file: concept/01-a-model-that-asks.html
