outcomes:
- Explain what logits, softmax and cross-entropy loss are, and compute a loss by hand.
- Write the training loop that every neural network uses, from a bigram table to a large model.
- 'Read a loss number: compare it with a uniform guess and say whether a model is learning.'
- Say what a one-token context can and cannot learn, and why attention is needed next.
steps:
- id: gradient-descent
  kind: video
  section: Pre-work
  title: Gradient descent, how neural networks learn
  channel: 3Blue1Brown
  youtube_id: IHZwWFHWa-w
  start: 0
  end: 1058
  watch_for:
  - 'The cost function: one number that says how wrong the whole network is.'
  - The gradient as the direction of steepest increase, and why you step the other way.
  - That learning means nudging every weight a little, many times. You will write that loop today.
- id: gpt-data-loading
  kind: video
  section: Pre-work
  title: 'Let''s build GPT: data, tokens and batches'
  channel: Andrej Karpathy
  youtube_id: kCc8FmEb1nY
  start: 0
  end: 1331
  watch_for:
  - How the text becomes one long tensor of token numbers, split into training and validation parts.
  - What a block and a batch are, and why the targets are the inputs shifted by one.
  - The segment stops at 22:11, just before he builds the bigram model, because you build it yourself in the session.
- id: bengio-2003
  kind: reading
  section: Pre-work
  title: A neural probabilistic language model
  source: Bengio, Ducharme, Vincent and Jauvin, 2003 · Journal of Machine Learning Research
  url: https://www.jmlr.org/papers/v3/bengio03a.html
  note: The paper that introduced learning a vector for each word together with the model that predicts the next word. Read section 1 for the idea (fighting the curse of dimensionality with learned word features) and look at figure 1. Skip the experiments.
