outcomes:
- Explain attention as a weighted average whose weights are computed from content, and work one out by hand.
- Write scaled dot-product attention and a causal attention head.
- Say why the scores are divided by the square root of the dimension, and why the mask goes before the softmax.
- 'State the two limits that follow from attention: no built-in sense of order, and cost that grows with the square of the context.'
