outcomes:
- Say when a task needs an agent and when a fixed workflow is the better design, with the costs of each.
- Assemble a triage agent that investigates with tools and then commits to a structured, checkable answer.
- Record a trace of every step, and use it to verify what the agent cites and to explain what it did.
- Compare the agent with the retrieval pipeline on accuracy, time and tokens, from your own runs on 100 incidents.
steps:
- id: how-we-build-agents
  kind: video
  section: Pre-work
  title: How we build effective agents
  channel: AI Engineer (Barry Zhang, Anthropic)
  youtube_id: D7_ipDqhtwk
  start: 0
  end: 909
  watch_for:
  - 'The first idea, from 2:31: do not build an agent for everything. Note the checklist for when one is justified.'
  - 'The second, from 5:36: keep it simple. An agent is a model, tools and a loop.'
  - 'The third, from 8:01: think from the agent''s point of view. All it knows is what is in its context window.'
- id: tips-for-agents
  kind: video
  section: Pre-work
  title: Tips for building AI agents
  channel: Anthropic
  youtube_id: LP5OCa20Zpg
  start: 0
  end: 449
  watch_for:
  - How the speakers separate a workflow from an agent. Session 8 was one; today you build the other.
  - 'The anatomy of an agent prompt, from 2:55. Compare it with the SYSTEM text in agent.py.'
  - Why tool descriptions deserve as much care as the prompt. You saw the reason in session 9.
- id: building-effective-agents
  kind: reading
  section: Pre-work
  title: Building effective agents
  source: Erik Schluntz and Barry Zhang, Anthropic, 2024
  url: https://www.anthropic.com/engineering/building-effective-agents
  note: 'Read the opening, the section "When (and when not) to use agents", and the summary. The essay distinguishes workflows, where code decides the steps, from agents, where the model does, and argues for the simplest design that works. Skim the workflow patterns in the middle: the pipeline you built in session 8 is the first of them. The appendix on tool design restates what session 9''s failures taught.'
