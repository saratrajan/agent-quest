  brief: 'Write triage: wrap the tools, start the conversation with the instructions and the ticket, run your tool loop from session 9, then ask for the committed answer and return it with the trace.'
- id: exp-one
  kind: experiment
  section: Session
  title: One incident, start to finish
  prompt: 'With the service desk and Ollama running, your agent triages held-back incident INC0010404, "Cruise deposit amount calculated wrongly", reported as P3. Predict which tools it calls and in what order, how many tokens it reads in total, and how long it takes. For comparison, the session 8 pipeline spent about 600 tokens and one second per incident. Read the trace: does each step follow from the one before? Then open data/traces/INC0010404.json and find the same run as data.'
  command: python lessons/10-agent/run.py --incident INC0010404
- id: exp-vague
  kind: experiment
  section: Session
  title: A ticket that says nothing, and a note to approve
  prompt: 'INC0010444 reads "Issue since this morning. Getting complaints on chat. Customers say they cannot finish what they were doing. Details to follow." Predict what the agent does: which tools, whether it finishes within its steps, which service it picks and what confidence it states. The script then shows the work note it would post and asks whether to post it. Decide before you run it what would make you type yes, then run it and decide.'
  command: python lessons/10-agent/run.py --incident INC0010444 --note
- id: exp-eval
  kind: experiment
  section: Session
  title: The agent on all 100
  prompt: 'The full run takes about 40 minutes; add --limit 20 for a first look in eight. Unlike the earlier runs, the agent is shown the priority the reporter chose, as a real triager would be. Reference points on the same incidents: the retrieval pipeline with its anchoring sentence scored 66% on priority and 89% on service at about one second each; the five-neighbour vote 67% and 86%; keeping the reporter''s priority 85%. Predict the agent''s priority and service scores, its seconds per incident, and its average number of tool calls. The script also prints how often the agent overrode the reporter and whether it was right to, and how accuracy varies with the confidence it stated. Predict both.'
  command: python lessons/10-agent/run.py --eval
