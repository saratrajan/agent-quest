<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Agent Quest stack: you open two separate local applications, the course app on port 8000 and the service desk on port 8080. The course app reads lessons and progress, and its assistant Buddy asks a local model under Ollama. The service desk stores incidents in SQLite. The triage agent you build later talks to the service desk over HTTP and to the local model.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b82"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d6fe0"/></marker>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d4bc4"/></marker>
</defs>
<rect width="1000" height="500" rx="14" fill="#f4f6fb" stroke="#e1e7f0"/>
<path d="M385 77H165V178" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#a)"/><path d="M615 77H835V178" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#a)"/>
<text x="275" y="67" text-anchor="middle" font-size="12" fill="#5b6b82" font-family="ui-monospace, Menlo, Consolas, monospace">localhost:8000</text><text x="725" y="67" text-anchor="middle" font-size="12" fill="#5b6b82" font-family="ui-monospace, Menlo, Consolas, monospace">localhost:8080</text>
<path d="M165 254V348" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#a)"/><path d="M835 254V348" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#a)"/>
<text x="153" y="298" text-anchor="end" font-size="12" fill="#5b6b82">reads lessons,</text><text x="153" y="314" text-anchor="end" font-size="12" fill="#5b6b82">runs your tests</text><text x="847" y="298" text-anchor="start" font-size="12" fill="#5b6b82">incidents, runbooks,</text><text x="847" y="314" text-anchor="start" font-size="12" fill="#5b6b82">deploys</text>
<path d="M280 217H330V385H383" fill="none" stroke="#1d6fe0" stroke-width="1.8" marker-end="url(#b)"/><text x="322" y="305" text-anchor="end" font-size="12" fill="#1d6fe0">Buddy asks, locally</text>
<path d="M500 254V348" fill="none" stroke="#6d4bc4" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#v)"/><text x="512" y="305" text-anchor="start" font-size="12" fill="#6d4bc4">prompts</text>
<path d="M615 217H718" fill="none" stroke="#6d4bc4" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#v)"/><text x="667" y="207" text-anchor="middle" font-size="12" fill="#6d4bc4" font-family="ui-monospace, Menlo, Consolas, monospace">HTTP /api</text>
<rect x="385" y="40" width="230" height="74" rx="10" fill="#0c1e3c" stroke="#0c1e3c" stroke-width="1.5"/><text x="500" y="72" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">You</text><text x="500" y="92" text-anchor="middle" font-size="12" fill="#c5d2e6">in a browser, and in your editor</text>
<rect x="50" y="180" width="230" height="74" rx="10" fill="#ffffff" stroke="#1d6fe0" stroke-width="2"/><text x="165" y="212" text-anchor="middle" font-weight="700" font-size="15" fill="#172338">Course app · FastAPI</text><text x="165" y="232" text-anchor="middle" font-size="12" fill="#5b6b82">sessions, progress, Buddy</text>
<rect x="385" y="180" width="230" height="74" rx="10" fill="#efeafc" stroke="#6d4bc4" stroke-width="2" stroke-dasharray="7 5"/><text x="500" y="212" text-anchor="middle" font-weight="700" font-size="15" fill="#172338">Triage agent</text><text x="500" y="232" text-anchor="middle" font-size="12" fill="#4a3a8f">you build it, sessions 6 to 10</text>
<rect x="720" y="180" width="230" height="74" rx="10" fill="#ffffff" stroke="#1d6fe0" stroke-width="2"/><text x="835" y="212" text-anchor="middle" font-weight="700" font-size="15" fill="#172338">Service desk · FastAPI</text><text x="835" y="232" text-anchor="middle" font-size="12" fill="#5b6b82">incident tool and JSON interface</text>
<rect x="50" y="350" width="230" height="74" rx="10" fill="#ffffff" stroke="#c9d3e2" stroke-width="1.5"/><text x="165" y="382" text-anchor="middle" font-weight="700" font-size="15" fill="#172338">Lessons and progress</text><text x="165" y="402" text-anchor="middle" font-size="12" fill="#5b6b82">PyTorch exercises, pytest, a JSON file</text>
<rect x="385" y="350" width="230" height="74" rx="10" fill="#ffffff" stroke="#c9d3e2" stroke-width="1.5"/><text x="500" y="382" text-anchor="middle" font-weight="700" font-size="15" fill="#172338">Local model · Ollama</text><text x="500" y="402" text-anchor="middle" font-size="12" fill="#5b6b82">qwen3:4b, nothing leaves the machine</text>
<rect x="720" y="350" width="230" height="74" rx="10" fill="#ffffff" stroke="#c9d3e2" stroke-width="1.5"/><text x="835" y="382" text-anchor="middle" font-weight="700" font-size="15" fill="#172338">SQLite</text><text x="835" y="402" text-anchor="middle" font-size="12" fill="#5b6b82">500 incidents, 5,127 work notes</text>
<text x="500" y="468" text-anchor="middle" font-size="12.5" fill="#5b6b82">Two apps, two ports, no shared code. Dashed parts are what you build yourself.</text>
</svg>
