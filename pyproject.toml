[project]
name = "agent-quest"
version = "0.1.0"
description = "Agent Quest: learn LLMs, RAG and agents by building a triage agent against a realistic service desk"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "pyyaml>=6.0", "tiktoken>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
lessons = ["torch>=2.4", "numpy>=2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
