# Markdown lint settings. Run locally with: npx markdownlint-cli2
config:
  default: true
  MD013: false   # line length: prose is wrapped by the editor, tables cannot be
  MD033: false   # inline HTML: the read-me header uses <picture> for light and dark logos
  MD041: false   # first line a heading: the read-me opens with the logo
globs:
  - "**/*.md"
ignores:
  - ".venv/**"
  - "docs/**"
  - "data/**"
  - "node_modules/**"
  - ".superpowers/**"
  - ".pytest_cache/**"
