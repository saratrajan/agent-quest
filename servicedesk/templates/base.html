<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Service Desk · Time Travel Inc.{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/desk.css">
</head>
<body>
{% macro icon(name) %}<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{% if name == "home" %}<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>{% elif name == "incidents" %}<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>{% elif name == "new" %}<path d="M12 5v14M5 12h14"/>{% elif name == "knowledge" %}<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>{% elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>{% elif name == "back" %}<path d="M19 12H5M11 6l-6 6 6 6"/>{% endif %}</svg>{% endmacro %}
<div class="app">
  <aside class="side">
    <a class="logo" href="/"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.600-1.700-8-6-8-11V5z" fill="#fff"/><path d="M12 7v5l3 2" fill="none" stroke="#0c1e3c" stroke-width="2" stroke-linecap="round"/></svg><span>Time Travel Inc.<b>Service Desk</b></span></a>
    <nav aria-label="Service desk">
      <a href="/" {% if nav == "home" %}aria-current="page"{% endif %}>{{ icon("home") }}Home</a>
      <a href="/incidents?view=open" {% if nav == "incidents" %}aria-current="page"{% endif %}>{{ icon("incidents") }}Incidents</a>
      <a href="/incidents/new" {% if nav == "new" %}aria-current="page"{% endif %}>{{ icon("new") }}New incident</a>
      <a href="/services" {% if nav == "knowledge" %}aria-current="page"{% endif %}>{{ icon("knowledge") }}Knowledge</a>
    </nav>
  </aside>
  <div class="body">
    <header class="top">
      <form class="search" method="get" action="/incidents" role="search">
        <input type="hidden" name="view" value="all">
        {{ icon("search") }}<label class="sr" for="top-q">Search incidents</label>
        <input id="top-q" type="search" name="q" placeholder="Search incidents…">
      </form>
    </header>
    <main>{% block main %}{% endblock %}</main>
  </div>
</div>
</body>
</html>
